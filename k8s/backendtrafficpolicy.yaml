apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mcphub-affinity
  namespace: mcphub
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mcphub
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Header
      header:
        name: Authorization
