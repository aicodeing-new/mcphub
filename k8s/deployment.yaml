apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcphub-db
  namespace: mcphub
  labels:
    app: mcphub-db
spec:
  replicas: 2
  minReadySeconds: 15
  progressDeadlineSeconds: 1200
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mcphub-db
  template:
    metadata:
      labels:
        app: mcphub-db
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: mcphub-db
      containers:
      - name: mcphub
        image: swr.cn-north-4.myhuaweicloud.com/pixiu-public/admins/mcphub:1.2.3
        ports:
        - name: http
          containerPort: 3000
        envFrom:
        - configMapRef:
            name: mcphub-runtime-config
        - secretRef:
            name: mcphub-runtime-secrets
        env:
        - name: MCPHUB_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 3Gi
        startupProbe:
          exec:
            command:
            - node
            - -e
            - Promise.all([fetch('http://127.0.0.1:3000/readyz'),fetch('http://127.0.0.1:3000/health')]).then(async
              ([r,h])=>{if(!r.ok||!h.ok||(await h.json()).status!=='healthy')process.exit(1)}).catch(()=>process.exit(1))
          periodSeconds: 5
          failureThreshold: 120
          timeoutSeconds: 6
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 2
          timeoutSeconds: 6
        lifecycle:
          preStop:
            exec:
              command:
              - node
              - -e
              - setTimeout(() => {}, 15000)
        volumeMounts:
        - name: local-data
          mountPath: /etc/mcphub
      volumes:
      - name: local-data
        emptyDir: {}
