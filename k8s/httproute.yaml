apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcphub
  namespace: mcphub
spec:
  hostnames:
    - mcphub.magikcloud.cn
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: magik-gw
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: mcphub
          port: 3000
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 1800s
